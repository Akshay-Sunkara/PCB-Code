# fly.io config for the pcb code proxy. one small machine, one volume for the
# sqlite file, always on so tokens keep counting. secrets are set separately:
#   fly secrets set OPENAI_API_KEY=sk-... ADMIN_KEY=...
app = "pcbcode-proxy"
primary_region = "sjc"

[build]

[env]
  PORT = "8787"
  PCBCODE_DB = "/data/pcbcode.db"
  TOKEN_LIMIT = "50000"
  MODEL = "gpt-6-astra"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[mounts]
  source = "pcbcode_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
